<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso PCCE do Zero</title>
<meta name="description" content="Curso gratuito do zero absoluto para Oficial Investigador da Polícia Civil do Ceará: aulas explicadas passo a passo, trilha de estudo, progresso e anotações.">
<meta name="theme-color" content="#1e3a8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#f5f6f8;--card:#ffffff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;
  --brand:#1e3a8a;--brand-2:#2547a8;--accent:#f59e0b;--ok:#059669;--soft:#eef2ff;--code:#f3f4f6;
}
:root[data-theme="dark"]{
  --bg:#0f141c;--card:#18202b;--text:#e5e7eb;--muted:#9ca3af;--line:#2a3442;
  --brand:#1e3a8a;--brand-2:#3b5bd1;--accent:#fbbf24;--ok:#34d399;--soft:#1c2740;--code:#222c3a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
a{color:var(--brand-2)}
header{background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header h1{font-size:1.05rem;margin:0;flex:1;letter-spacing:.3px}
header h1 small{display:block;font-weight:400;font-size:.75rem;opacity:.8}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;font-size:.9rem}
.btn:hover{border-color:var(--brand-2)}
a.btn{text-decoration:none;display:inline-block}
.btn.primary{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.done{background:transparent;color:var(--ok);border-color:var(--ok)}
header .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
#menu-btn{display:none}
.global{min-width:160px}
.global span{font-size:.72rem;opacity:.85}
.bar{height:6px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:4px}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .4s}
.layout{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 60px)}
aside{background:var(--card);border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 60px);position:sticky;top:60px}
aside .top{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
aside .top a{text-decoration:none;font-weight:600}
.mod{border-bottom:1px solid var(--line)}
.mod>button{all:unset;cursor:pointer;display:flex;width:100%;box-sizing:border-box;padding:12px 16px;gap:10px;align-items:center}
.mod>button:hover{background:var(--soft)}
.mod .num{font-size:.75rem;font-weight:700;color:#fff;background:var(--brand-2);border-radius:6px;padding:2px 7px}
.mod .name{flex:1;font-weight:600;font-size:.92rem}
.mod .cnt{font-size:.75rem;color:var(--muted)}
.mod ul{list-style:none;margin:0;padding:0 0 8px;display:none}
.mod.open ul{display:block}
.mod li a{display:flex;gap:8px;padding:6px 16px 6px 22px;text-decoration:none;color:var(--text);font-size:.88rem;align-items:flex-start}
.mod li a:hover{background:var(--soft)}
.mod li a.active{background:var(--soft);border-left:3px solid var(--accent);padding-left:19px}
.mod li a.soon{color:var(--muted)}
.mod li .dot{flex:0 0 16px;height:16px;border-radius:50%;border:2px solid var(--line);margin-top:3px}
.mod li a.ok .dot{background:var(--ok);border-color:var(--ok)}
.tag{font-size:.68rem;border:1px solid var(--line);border-radius:99px;padding:0 6px;color:var(--muted);margin-left:auto;white-space:nowrap}
main{padding:24px 16px 64px;overflow-x:hidden}
article{max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 32px}
article h1{font-size:1.7rem;line-height:1.25;margin-top:0;color:var(--brand-2)}
article h2{font-size:1.25rem;margin-top:2rem;padding-bottom:4px;border-bottom:2px solid var(--line)}
article h3{font-size:1.05rem}
article blockquote{margin:1rem 0;padding:10px 16px;background:var(--soft);border-left:4px solid var(--accent);border-radius:6px}
article blockquote p{margin:.3rem 0}
article table{border-collapse:collapse;width:100%;margin:1rem 0;font-size:.92rem;display:block;overflow-x:auto}
article th,article td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
article th{background:var(--soft)}
article pre{background:var(--code);padding:14px;border-radius:8px;overflow-x:auto;font-size:.82rem;line-height:1.45}
article code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.88em}
article pre code{background:none;padding:0}
article details{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:.4rem 0 1.2rem}
article summary{cursor:pointer;font-weight:600;color:var(--ok)}
article img{max-width:100%}
.lesson-nav{max-width:820px;margin:18px auto 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.notes{max-width:820px;margin:18px auto 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.notes h3{margin:0 0 8px;font-size:1rem}
.notes textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--bg);color:var(--text);resize:vertical}
.notes small{color:var(--muted)}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:1rem}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:var(--text);display:block;background:var(--card)}
.card:hover{border-color:var(--brand-2)}
.card b{display:block;margin-bottom:4px}
.card p{margin:0 0 8px;font-size:.85rem;color:var(--muted)}
.card .mini{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.card .mini>div{height:100%;background:var(--ok)}
.soon-box{text-align:center;padding:30px 10px;color:var(--muted)}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  #menu-btn{display:inline-block}
  aside{position:fixed;top:60px;left:0;bottom:0;width:min(88vw,340px);max-height:none;transform:translateX(-100%);transition:transform .25s;z-index:15;box-shadow:0 0 30px rgba(0,0,0,.3)}
  aside.show{transform:none}
  article{padding:20px 16px}
  .global{display:none}
}
</style>
</head>
<body>
<header>
  <button id="menu-btn" class="btn" onclick="ui.toggleMenu()" aria-label="Abrir trilha">☰</button>
  <h1>Curso PCCE do Zero<small>Oficial Investigador · Polícia Civil do Ceará</small></h1>
  <div class="global"><span id="g-text">Progresso: 0%</span><div class="bar"><div id="g-bar"></div></div></div>
  <button class="btn" onclick="ui.toggleTheme()" aria-label="Alternar tema">🌓 Tema</button>
</header>
<div class="layout">
  <aside id="side">
    <div class="top">
      <a href="#/">🏠 Início</a>
      <a href="#/guia">📘 Guia completo (plano de estudos)</a>
    </div>
    <nav id="tree"></nav>
  </aside>
  <main id="main"></main>
</div>
<script>
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const ui={
  trilha:null,lista:[],feitas:store.get('pcce.feitas',{}),abertos:store.get('pcce.abertos',{'00':true,'01':true}),
  async init(){
    const t=store.get('pcce.tema',null);
    if(t)document.documentElement.dataset.theme=t;
    else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark';
    try{this.trilha=await (await fetch('aulas/trilha.json',{cache:'no-cache'})).json()}
    catch(e){document.getElementById('main').innerHTML='<article><h1>Não foi possível carregar a trilha</h1><p>Abra o site pelo endereço do GitHub Pages ou rode <code>python3 -m http.server</code> na pasta do projeto e acesse <code>http://localhost:8000</code>.</p></article>';return}
    this.trilha.modulos.forEach(m=>m.aulas.forEach(a=>this.lista.push({...a,modulo:m})));
    this.renderTree();this.updateGlobal();
    addEventListener('hashchange',()=>this.route());this.route();
  },
  toggleTheme(){
    const r=document.documentElement,n=r.dataset.theme==='dark'?'light':'dark';
    r.dataset.theme=n;store.set('pcce.tema',n);
  },
  toggleMenu(f){document.getElementById('side').classList.toggle('show',f)},
  toggleMod(id){this.abertos[id]=!this.abertos[id];store.set('pcce.abertos',this.abertos);this.renderTree()},
  prontas(m){return m.aulas.filter(a=>a.arquivo)},
  renderTree(){
    const atual=(location.hash.match(/#\/aula\/(.+)/)||[])[1];
    document.getElementById('tree').innerHTML=this.trilha.modulos.map(m=>{
      const p=this.prontas(m),ok=p.filter(a=>this.feitas[a.id]).length;
      const cnt=p.length?`${ok}/${p.length}`:'em breve';
      return `<div class="mod ${this.abertos[m.id]?'open':''}">
        <button onclick="ui.toggleMod('${m.id}')"><span class="num">${m.id}</span><span class="name">${m.titulo}</span><span class="cnt">${cnt}</span></button>
        <ul>${m.aulas.map(a=>`<li><a href="#/aula/${a.id}" class="${a.arquivo?'':'soon'} ${this.feitas[a.id]?'ok':''} ${a.id===atual?'active':''}"><span class="dot"></span><span>${a.titulo}</span>${a.arquivo?'':'<span class="tag">em breve</span>'}</a></li>`).join('')}</ul>
      </div>`}).join('');
  },
  updateGlobal(){
    const p=this.lista.filter(a=>a.arquivo),ok=p.filter(a=>this.feitas[a.id]).length,pc=p.length?Math.round(ok*100/p.length):0;
    document.getElementById('g-text').textContent=`Progresso: ${ok}/${p.length} aulas (${pc}%)`;
    document.getElementById('g-bar').style.width=pc+'%';
  },
  async route(){
    this.toggleMenu(false);
    const h=location.hash;
    if(h.startsWith('#/aula/'))await this.aula(h.slice(7));
    else if(h==='#/guia')await this.md('GUIA-COMPLETO-PCCE.md');
    else this.home();
    this.renderTree();scrollTo(0,0);
  },
  home(){
    const prox=this.lista.find(a=>a.arquivo&&!this.feitas[a.id]);
    document.getElementById('main').innerHTML=`<article>
      <h1>Do zero absoluto à Polícia Civil do Ceará</h1>
      <p>Este é um curso para quem <b>nunca estudou Direito</b> e não tem base em nenhuma matéria. Cada aula explica um assunto passo a passo: o porquê, a explicação em linguagem simples, as palavras novas, a lei traduzida, exemplos, o que confunde, como cai na prova e exercícios com resposta.</p>
      <blockquote><p><b>Comece pelo Módulo 0</b> e siga a ordem da trilha. Cada módulo depende dos anteriores.</p></blockquote>
      ${prox?`<p><a class="btn primary" href="#/aula/${prox.id}">▶ Continuar: ${prox.titulo}</a></p>`:''}
      <h2>Módulos</h2>
      <div class="home-grid">${this.trilha.modulos.map(m=>{
        const p=this.prontas(m),ok=p.filter(a=>this.feitas[a.id]).length,pc=p.length?Math.round(ok*100/p.length):0,primeira=m.aulas[0];
        return `<a class="card" href="#/aula/${primeira.id}"><b>${m.id} · ${m.titulo}</b><p>${m.descricao}</p><p>${p.length?`${ok}/${p.length} aulas concluídas · ${m.aulas.length} no total`:`${m.aulas.length} aulas · em breve`}</p><div class="mini"><div style="width:${pc}%"></div></div></a>`}).join('')}</div>
      <h2>Como usar</h2>
      <ul><li>Leia a aula e faça o <b>Teste-se</b> antes de abrir as respostas.</li><li>Marque a aula como concluída: o progresso fica salvo neste navegador.</li><li>Use <b>Minhas anotações</b> para o seu resumo e as suas dúvidas.</li><li>O <a href="#/guia">Guia completo</a> traz o plano: rotina, ciclos, revisões, edital, TAF e referências.</li></ul>
    </article>`;
  },
  async md(arquivo){
    const r=await fetch(arquivo,{cache:'no-cache'});
    const txt=r.ok?await r.text():'# Arquivo não encontrado';
    document.getElementById('main').innerHTML=`<article>${marked.parse(txt)}</article>`;
    document.querySelectorAll('article a[href^="#"]').forEach(a=>{
      const alvo=a.getAttribute('href').slice(1);
      if(!alvo.startsWith('/'))a.addEventListener('click',e=>{e.preventDefault();const el=document.getElementById(alvo);if(el)el.scrollIntoView({behavior:'smooth'})});
    });
    document.querySelectorAll('article h1,article h2,article h3').forEach(h=>{if(!h.id)h.id=h.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu,'').replace(/\s/g,'-')});
  },
  async aula(id){
    const i=this.lista.findIndex(a=>a.id===id);
    if(i<0)return this.home();
    const a=this.lista[i];this.abertos[a.modulo.id]=true;store.set('pcce.abertos',this.abertos);
    const ant=this.lista.slice(0,i).reverse().find(x=>x.arquivo),prox=this.lista.slice(i+1).find(x=>x.arquivo);
    const main=document.getElementById('main');
    if(!a.arquivo){
      main.innerHTML=`<article><p class="tag" style="display:inline-block">Módulo ${a.modulo.id} · ${a.modulo.titulo}</p><h1>${a.titulo}</h1><div class="soon-box"><p>Esta aula ainda está sendo escrita.</p><p>Enquanto isso, veja o conteúdo deste assunto no <a href="#/guia">Guia completo</a>.</p></div></article>${this.nav(ant,prox)}`;
      return;
    }
    await this.md(a.arquivo);
    const nota=store.get('pcce.nota.'+id,'');
    main.insertAdjacentHTML('afterbegin',`<div style="max-width:820px;margin:0 auto 10px"><span class="tag">Módulo ${a.modulo.id} · ${a.modulo.titulo}</span></div>`);
    main.insertAdjacentHTML('beforeend',`
      <div class="lesson-nav"><span></span><button id="done-btn" class="btn ${this.feitas[id]?'done':'primary'}" onclick="ui.marcar('${id}')">${this.feitas[id]?'✓ Concluída (desmarcar)':'Marcar como concluída'}</button></div>
      <div class="notes"><h3>📝 Minhas anotações</h3><textarea id="nota" placeholder="Seu resumo com suas palavras, dúvidas, exemplos próprios...">${nota.replace(/</g,'&lt;')}</textarea><small>Salvo automaticamente neste navegador.</small></div>
      ${this.nav(ant,prox)}`);
    document.getElementById('nota').addEventListener('input',e=>store.set('pcce.nota.'+id,e.target.value));
  },
  nav(ant,prox){
    return `<div class="lesson-nav">${ant?`<a class="btn" href="#/aula/${ant.id}">← ${ant.titulo}</a>`:'<span></span>'}${prox?`<a class="btn" href="#/aula/${prox.id}">${prox.titulo} →</a>`:''}</div>`;
  },
  marcar(id){
    if(this.feitas[id])delete this.feitas[id];else this.feitas[id]=new Date().toISOString().slice(0,10);
    store.set('pcce.feitas',this.feitas);
    const b=document.getElementById('done-btn'),f=!!this.feitas[id];
    b.className='btn '+(f?'done':'primary');b.textContent=f?'✓ Concluída (desmarcar)':'Marcar como concluída';
    this.renderTree();this.updateGlobal();
  }
};
ui.init();
</script>
</body>
</html>
