  <text x="36" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#111110">Da Leitura Guiada (§ 01–§ 09) à Memória de Longo Prazo (24h · 7d · 30d)</text>

