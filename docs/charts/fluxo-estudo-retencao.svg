    <text x="16" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#52514E">§ 03 Vocabulário técnico</text>
    <text x="16" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7D7B74">COMPREENSÃO CONCEITUAL</text>
